[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "buildlog"
version = "0.2.0"
description = "Transform engineering evidence into reviewable communication and human-approved LinkedIn posts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1.0",
  "litellm>=1.0",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
  "sqlalchemy>=2.0,<3.0",
]

[project.scripts]
buildlog = "buildlog.main:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
